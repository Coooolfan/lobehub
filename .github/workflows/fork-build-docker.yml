name: Fork Docker Build (GHCR)
run-name: Build ${{ inputs.source_ref }} for GHCR

# Fork-only manual image publisher. Keep this workflow on the fork's default
# branch and select the source branch/tag/SHA through `source_ref`, so feature
# branches do not need to carry a workflow file that upstream does not want.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: canary
        type: string

concurrency:
  group: fork-docker-${{ inputs.source_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/lobehub

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: tags
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          source_tag=$(echo "${SOURCE_REF}" | sed -E 's/[^a-zA-Z0-9_.-]+/-/g')
          commit_sha=$(git rev-parse --short HEAD)
          {
            echo "source_tag=${source_tag}"
            echo "sha_tag=${source_tag}-${commit_sha}"
            echo "commit_sha=${commit_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          build-args: |
            SHA=${{ steps.tags.outputs.commit_sha }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.tags.outputs.source_tag }}
            ${{ env.REGISTRY_IMAGE }}:${{ steps.tags.outputs.sha_tag }}

      - name: Publish image summary
        env:
          SOURCE_TAG: ${{ steps.tags.outputs.source_tag }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          {
            echo "### Image pushed to GHCR"
            echo
            echo "\`${REGISTRY_IMAGE}:${SOURCE_TAG}\`"
            echo
            echo "\`${REGISTRY_IMAGE}:${SHA_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
